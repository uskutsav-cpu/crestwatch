name: River threshold notifications
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crestwatch-river-notifications
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types scripts/notify-river-watches.mjs
        env:
          CRESTWATCH_MONITOR_TOKEN: ${{ secrets.CRESTWATCH_MONITOR_TOKEN }}
          CRESTWATCH_VAPID_PUBLIC_KEY: ${{ secrets.CRESTWATCH_VAPID_PUBLIC_KEY }}
          CRESTWATCH_VAPID_PRIVATE_KEY: ${{ secrets.CRESTWATCH_VAPID_PRIVATE_KEY }}
